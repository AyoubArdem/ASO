[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aso-security"
version = "0.1.0"
description = "Security orchestration library for AI agents, memory, tools, and secrets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]
authors = [
  { name = "ASO Contributors" }
]
license = { text = "MIT" }
[project.urls]
Homepage = "https://github.com/aso-security/aso"
Repository = "https://github.com/aso-security/aso"
Documentation = "https://aso-security.readthedocs.io/"
Issues = "https://github.com/aso-security/aso/issues"

keywords = [
  "ai",
  "security",
  "agents",
  "orchestration",
  "memory",
  "tools",
  "secrets",
  "guardrail",
  "llm"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved ::  Apache License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0", "langchain-openai>=0.2.0"]
google = ["google-genai>=0.1.0", "langchain-google-genai>=2.0.0"]
huggingface = ["transformers>=4.0.0", "langchain-huggingface>=0.1.0"]
ollama = ["langchain-ollama>=0.2.0"]
langchain = ["langchain-core>=0.2.0"]
all = [
  "openai>=1.0.0",
  "langchain-openai>=0.2.0",
  "google-genai>=0.1.0",
  "langchain-google-genai>=2.0.0",
  "transformers>=4.0.0",
  "langchain-huggingface>=0.1.0",
  "langchain-ollama>=0.2.0",
  "langchain-core>=0.2.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "build>=1.2.0",
  "twine>=5.1.0",
]

[tool.setuptools]
include-package-data = true
packages = ["aso", "DecisionEngine", "MemoryGuard", "PromptGuard", "ToolGuard", "SecretGuard"]

[tool.setuptools.package-dir]
aso = "src/aso"
DecisionEngine = "DecisionEngine"
MemoryGuard = "MemoryGuard"
PromptGuard = "PromptGuard"
ToolGuard = "ToolGuard"
SecretGuard = "SecretGuard"
